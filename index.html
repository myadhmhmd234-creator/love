<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S♥M </title>
<style>
body{
margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;
background:linear-gradient(135deg,#ff758c,#ff7eb3,#ff8e9e);
font-family:'Segoe UI',Tahoma;
overflow:hidden;
}
.hearts{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
.heart{position:absolute;animation:fall linear infinite;color:#fff;opacity:0.8}
@keyframes fall{0%{transform:translateY(-100px) rotate(0deg)}100%{transform:translateY(100vh) rotate(360deg)}}
.card{
background:rgba(255,255,255,0.95);padding:40px 30px;border-radius:30px;
box-shadow:0 20px 60px rgba(0,0,0,0.2);text-align:center;z-index:2;
max-width:350px;width:90%;animation:pop 1s ease;

@keyframes pop{0%{transform:scale(0.5);opacity:0}100%{transform:scale(1);opacity:1}}
h1{color:#ff3e6c;font-size:32px;margin:10px 0}
.names{font-size:42px;margin:20px 0}
p{color:#555;line-height:1.8;font-size:18px}
button{
background:linear-gradient(135deg,#ff3e6c,#ff758c);color:white;border:none;
padding:15px 35px;border-radius:50px;font-size:18px;cursor:pointer;
margin-top:20px;box-shadow:0 5px 15px rgba(255,62,108,0.4);transition:0.3s
}
button:hover{transform:scale(1.05)}
.hidden{display:none;margin-top:20px;color:#ff3e6c;font-weight:bold;animation:fade 1s}
@keyframes fade{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>
<div class="hearts" id="hearts"></div>
<div class="card">
<div class="names">S♥M</div>
<h1>حب لا ينتهي</h1>
<p>بحبككككك💗<br>وكل ضحكة منك هي حياة<br><br>بحبك أكتر من الكلام يقدر يوصف ❤️</p>
<button onclick="showLove()">دوسي هنا يا ندى</button>
<div id="msg" class="hidden">
انتِ أجمل حاجة حصلت في حياتي<br>وربنا يخليكي ليا طول العمر<br>💖💖💖<br><br> - سمير
</div>
</div>
<script>
function showLove(){
document.getElementById('msg').style.display='block';
for(let i=0;i<30;i++){createHeart()}
}
function createHeart(){
const h=document.createElement('div');
h.className='heart';h.innerHTML='❤️';
h.style.left=Math.random()*100+'vw';
h.style.animationDuration=(Math.random()*3+2)+'s';
h.style.fontSize=(Math.random()*20+15)+'px';
document.getElementById('hearts').appendChild(h);
setTimeout(()=>h.remove(),5000);
}
setInterval(createHeart,300);
</script>
</body>
</html>
