
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمير ❤️ روح قلبي</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);font-family:'Segoe UI',Tahoma;color:white;padding:20px}
.card{background:rgba(255,255,255,0.12);backdrop-filter:blur(15px);padding:25px;border-radius:30px;text-align:center;max-width:400px;width:95%;border:1px solid rgba(255,255,255,0.2);margin-top:20px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
.names{font-size:40px;font-weight:bold;margin:10px 0}
h1{color:#ff7eb3;font-size:26px;margin:10px 0}
p{line-height:2;color:#eee;font-size:18px}
button{background:linear-gradient(135deg,#ff758c,#ff7eb3);color:white;border:none;padding:15px 35px;border-radius:50px;font-size:19px;cursor:pointer;margin:15px 0;box-shadow:0 5px 15px rgba(255,126,179,0.4)}
img,video{width:100%;border-radius:20px;margin:14px 0;box-shadow:0 10px 30px rgba(0,0,0,0.4)}
.hidden{display:none;animation:pop 0.8s}
@keyframes pop{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}
.msg{background:rgba(255,255,255,0.15);padding:15px;border-radius:15px;margin-top:15px;line-height:1.9}
</style>
</head>
<body>
<div class="card">
<div class="names">سمير ❤️</div>
<h1>يا أغلى حاجة في حياتي</h1>
<p>💗بحبكككك💗 <br>💕💕💕💕ر<br>
