<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمير ❤️</title>
<style>
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);font-family:'Segoe UI';color:white;padding:15px}
.card{background:rgba(255,255,255,0.12);backdrop-filter:blur(15px);padding:22px;border-radius:25px;text-align:center;max-width:400px;width:95%;border:1px solid rgba(255,255,255,0.2)}
.lock{font-size:50px;margin-bottom:10px}
input{width:90%;padding:12px;border-radius:20px;border:none;text-align:center;font-size:18px;margin:10px 0}
.names{font-size:38px;font-weight:bold}
h1{color:#ff7eb3;font-size:24px}
p{line-height:1.8;color:#eee;font-size:18px}
button{background:linear-gradient(135deg,#ff758c,#ff7eb3);color:white;border:none;padding:14px 30px;border-radius:50px;font-size:18px;margin:12px;cursor:pointer}
img,video{width:100%;border-radius:18px;margin:12px 0}
.hidden{display:none}
.msg{background:rgba(255,255,255,0.15);padding:15px;border-radius:15px;margin-top:10px;line-height:1.8}
.error{color:#ff7e7e;font-size:14px;display:none}
</style>
</head>
<body>
<div class="card">
<div id="lockScreen">
<div class="lock">🔒</div>
<h1>الموقع ده لسمير بس</h1>
<p>اكتب كلمة السر يا سيمو ❤️</p>
<input type="password" id="pass" placeholder="كلمة السر">
<br>
<button onclick="checkPass()">افتح يا حبيبي 💕</button>
<p id="err" class="error">الباسورد غلط يا سيمو حاول تاني 🥺</p>
</div>

<div id="mainContent" class="hidden">
<div class="names">سمير ❤️ روحي</div>
<h1>يا أغلى حاجة في حياتي</h1>
<p>بحبكككك 💕<br>روح قلبي 
❤️</p>
<button onclick="document.getElementById('g').style.display='block';this.style.display='none'">افتح هديتك 🎁</button>
<div id="g" class="hidden">
<img src="Screenshot_20260915_101608_com.whatsapp.jpg">
<video controls playsinline><source src="video mp4.mp4"></video>
<video controls playsinline><source src="video mp3.mp4"></video>
<video controls playsinline><source src="2026-10-23-213202270.mp4"></video>
<div class="msg">
من يوم عيونك جت في عنيا 😂<br>كمل الاغنية دي 😜<br><br>
ربنا يخليك ليا يا مشاكس<br>💍 اغلي من حياتي 💍<br><br>
- سيمو
</div>
</div>
</div>
</div>
</div>

<script>
function checkPass(){
var correct = "2172007";
var input = document.getElementById("pass").value;
if(input === correct){
document.getElementById("lockScreen").style.display="none";
document.getElementById("mainContent").style.display="block";
}else{
document.getElementById("err").style.display="block";
}
}
</script>
</body>
</html>
